name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Installation
        run: python -m pip install -e ".[dev]"
      - name: Tests unitaires (sans GPU ni modèle)
        run: python -m pytest -q
      - name: Corpus valides, mesure par règles seules
        run: |
          python -m pseudonymiseur evaluer corpus/developpement --sans-llm
          python -m pseudonymiseur evaluer corpus/controle --sans-llm
